name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source, packages, and Skill
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Require the supported release architecture
        run: test "$(uname -m)" = arm64

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify source, generated artifacts, npm packages, and Skill bundle
        run: bun run verify:ci

      - name: Validate Agent Skill structure
        run: npx --yes skills@1.5.23 add . --list
